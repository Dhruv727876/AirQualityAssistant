services:
  - type: web
    runtime: static
    name: airqualityassistant-app
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
    headers:
      # WHY: connect-src must list the server origin because VITE_API_URL points there.
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://airqualityassistant.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
